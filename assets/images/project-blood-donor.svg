<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bdBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1326"/>
      <stop offset="100%" stop-color="#060913"/>
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4b5c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="cyanAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <pattern id="gridPattern" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.8" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Base Card Background -->
  <rect width="600" height="360" rx="12" fill="url(#bdBg)"/>
  <rect width="600" height="360" rx="12" fill="url(#gridPattern)"/>
  <rect width="600" height="360" rx="12" fill="none" stroke="#334155" stroke-width="1"/>

  <!-- Radar Conic / Sweep Rings -->
  <circle cx="300" cy="180" r="130" fill="none" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="300" cy="180" r="90" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 4"/>
  <circle cx="300" cy="180" r="50" fill="none" stroke="#ff4b5c" stroke-width="1" stroke-opacity="0.4"/>

  <!-- Map Crosshairs & Grid Lines -->
  <line x1="120" y1="180" x2="480" y2="180" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8"/>
  <line x1="300" y1="40" x2="300" y2="320" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 8"/>

  <!-- Geolocation Nodes / Donors -->
  <!-- Center Node (Emergency / Request Center) -->
  <circle cx="300" cy="180" r="24" fill="#1e1b4b" stroke="url(#redAccent)" stroke-width="2.5"/>
  <path d="M293 176 C293 172 300 165 300 165 C300 165 307 172 307 176 C307 180 304 184 300 184 C296 184 293 180 293 176 Z" fill="url(#redAccent)"/>
  <circle cx="300" cy="180" r="32" fill="none" stroke="#ff4b5c" stroke-width="1" stroke-opacity="0.6">
    <animate attributeName="r" values="24;42;24" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.8;0;0.8" dur="3s" repeatCount="indefinite"/>
  </circle>

  <!-- Nearby Active Donors (Nodes) -->
  <g id="donor1">
    <line x1="300" y1="180" x2="220" y2="110" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
    <circle cx="220" cy="110" r="14" fill="#0f2942" stroke="#00f5ff" stroke-width="2"/>
    <circle cx="220" cy="110" r="5" fill="#10b981"/>
    <text x="220" y="90" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">DONOR_A+ [1.2km]</text>
  </g>

  <g id="donor2">
    <line x1="300" y1="180" x2="390" y2="120" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
    <circle cx="390" cy="120" r="14" fill="#0f2942" stroke="#00f5ff" stroke-width="2"/>
    <circle cx="390" cy="120" r="5" fill="#10b981"/>
    <text x="390" y="100" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">DONOR_O+ [2.4km]</text>
  </g>

  <g id="donor3">
    <line x1="300" y1="180" x2="360" y2="250" stroke="#00f5ff" stroke-width="1.5" stroke-dasharray="3 3" stroke-opacity="0.6"/>
    <circle cx="360" cy="250" r="14" fill="#0f2942" stroke="#00f5ff" stroke-width="2"/>
    <circle cx="360" cy="250" r="5" fill="#10b981"/>
    <text x="360" y="275" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">DONOR_B+ [3.1km]</text>
  </g>

  <!-- HUD Telemetry overlays -->
  <rect x="25" y="25" width="160" height="50" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="35" y="44" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">SYSTEM STATUS: ACTIVE</text>
  <text x="35" y="60" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">RBAC &amp; PRIVACY SHIELD</text>

  <rect x="415" y="285" width="160" height="50" rx="6" fill="#0f172a" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
  <text x="425" y="304" fill="#10b981" font-family="'Fira Code', monospace" font-size="10" font-weight="bold">MATCH ACCURACY: 98%</text>
  <text x="425" y="320" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">ENCRYPTED TELEMETRY</text>

  <!-- ECG / Pulse Line -->
  <path d="M 40 310 L 100 310 L 110 295 L 120 325 L 130 300 L 140 310 L 220 310" fill="none" stroke="#ff4b5c" stroke-width="2" stroke-linecap="round"/>
</svg>
