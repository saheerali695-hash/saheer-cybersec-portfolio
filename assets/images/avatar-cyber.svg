<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="cyberGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="0.25"/>
      <stop offset="60%" stop-color="#10b981" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#050811" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cyberAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="shieldFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="neonBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <rect width="400" height="400" fill="transparent"/>
  <circle cx="200" cy="200" r="180" fill="url(#cyberGlow)"/>

  <!-- Rotating Radar / Tech Rings -->
  <circle cx="200" cy="200" r="160" fill="none" stroke="#1e293b" stroke-width="2" stroke-dasharray="8 6"/>
  <circle cx="200" cy="200" r="140" fill="none" stroke="#00f5ff" stroke-width="1.5" stroke-opacity="0.4" stroke-dasharray="14 10 4 10"/>
  <circle cx="200" cy="200" r="115" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="5 5"/>

  <!-- Crosshairs and Coordinates -->
  <line x1="20" y1="200" x2="380" y2="200" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>
  <line x1="200" y1="20" x2="200" y2="380" stroke="#00f5ff" stroke-width="1" stroke-opacity="0.15" stroke-dasharray="4 8"/>

  <!-- Central Defensive Shield / Tech Emblem -->
  <path d="M200 70 L290 110 V200 C290 265 245 315 200 335 C155 315 110 265 110 200 V110 Z" fill="url(#shieldFill)" stroke="url(#cyberAccent)" stroke-width="3" filter="url(#neonBlur)"/>

  <!-- Inner Cyber Pattern & Circuit Traces -->
  <path d="M140 140 H180 V170 H220 V140 H260" fill="none" stroke="#00f5ff" stroke-width="2" stroke-opacity="0.6"/>
  <circle cx="140" cy="140" r="3" fill="#00f5ff"/>
  <circle cx="260" cy="140" r="3" fill="#00f5ff"/>

  <!-- Central Analyst Monogram / Node -->
  <circle cx="200" cy="195" r="45" fill="#0b1329" stroke="#00f5ff" stroke-width="2"/>
  
  <!-- Stylized Terminal Shield Icon -->
  <path d="M185 185 L195 195 L185 205" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <line x1="202" y1="205" x2="216" y2="205" stroke="#00f5ff" stroke-width="3" stroke-linecap="round"/>

  <!-- Target Lock Corners -->
  <path d="M60 90 V60 H90" fill="none" stroke="#00f5ff" stroke-width="2"/>
  <path d="M340 90 V60 H310" fill="none" stroke="#00f5ff" stroke-width="2"/>
  <path d="M60 310 V340 H90" fill="none" stroke="#00f5ff" stroke-width="2"/>
  <path d="M340 310 V340 H310" fill="none" stroke="#00f5ff" stroke-width="2"/>

  <!-- Telemetry Text Badges -->
  <text x="70" y="80" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="11" letter-spacing="1">DEFENSE // SOC</text>
  <text x="245" y="80" fill="#10b981" font-family="'Fira Code', monospace" font-size="11" letter-spacing="1">BCA_GRAD</text>
  <text x="200" y="365" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="10" text-anchor="middle" letter-spacing="2">MUHAMAD SAHEER ALI M.N</text>
</svg>
