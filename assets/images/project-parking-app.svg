<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="100%" height="100%">
  <defs>
    <linearGradient id="vpBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07101e"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="bayAvailable" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#047857" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="bayOccupied" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#b45309" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Base Background -->
  <rect width="600" height="360" rx="12" fill="url(#vpBg)"/>
  <rect width="600" height="360" rx="12" fill="none" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Diagnostic Header -->
  <rect x="25" y="20" width="550" height="40" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1"/>
  <circle cx="45" cy="40" r="5" fill="#10b981"/>
  <text x="60" y="44" fill="#f8fafc" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">PARKSEC_OS // AUTOMATED VEHICLE INGRESS &amp; EGRESS</text>
  <text x="440" y="44" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="10">GATE_AUTH: VERIFIED</text>

  <!-- Isometric / Grid Parking Bays -->
  <!-- Bay A1 (Occupied) -->
  <g transform="translate(60, 90)">
    <rect width="105" height="150" rx="8" fill="url(#bayOccupied)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="15" y="28" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">SLOT A-01</text>
    <text x="15" y="45" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">OCCUPIED</text>
    <!-- Car Graphic -->
    <rect x="25" y="60" width="55" height="75" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="33" y="70" width="39" height="18" rx="4" fill="#334155"/>
    <circle cx="33" cy="120" r="4" fill="#ff4b5c"/>
    <circle cx="72" cy="120" r="4" fill="#ff4b5c"/>
  </g>

  <!-- Bay A2 (Available) -->
  <g transform="translate(185, 90)">
    <rect width="105" height="150" rx="8" fill="url(#bayAvailable)" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="28" fill="#10b981" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">SLOT A-02</text>
    <text x="15" y="45" fill="#34d399" font-family="'Fira Code', monospace" font-size="9">AVAILABLE</text>
    <!-- QR / NFC Reservation Target -->
    <rect x="30" y="70" width="45" height="45" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M40 80 H47 V87 H40 Z M57 80 H65 V87 H57 Z M40 98 H47 V105 H40 Z" fill="#10b981"/>
    <text x="52" y="130" fill="#10b981" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">RESERVE</text>
  </g>

  <!-- Bay A3 (Occupied) -->
  <g transform="translate(310, 90)">
    <rect width="105" height="150" rx="8" fill="url(#bayOccupied)" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
    <text x="15" y="28" fill="#f59e0b" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">SLOT A-03</text>
    <text x="15" y="45" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">OCCUPIED</text>
    <rect x="25" y="60" width="55" height="75" rx="10" fill="#1e293b" stroke="#f59e0b" stroke-width="1.5"/>
    <rect x="33" y="70" width="39" height="18" rx="4" fill="#334155"/>
    <circle cx="33" cy="120" r="4" fill="#ff4b5c"/>
    <circle cx="72" cy="120" r="4" fill="#ff4b5c"/>
  </g>

  <!-- Bay A4 (Available) -->
  <g transform="translate(435, 90)">
    <rect width="105" height="150" rx="8" fill="url(#bayAvailable)" stroke="#10b981" stroke-width="1.5"/>
    <text x="15" y="28" fill="#10b981" font-family="'Fira Code', monospace" font-size="11" font-weight="bold">SLOT A-04</text>
    <text x="15" y="45" fill="#34d399" font-family="'Fira Code', monospace" font-size="9">AVAILABLE</text>
    <rect x="30" y="70" width="45" height="45" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.5"/>
    <path d="M40 80 H47 V87 H40 Z M57 80 H65 V87 H57 Z M40 98 H47 V105 H40 Z" fill="#10b981"/>
    <text x="52" y="130" fill="#10b981" font-family="'Fira Code', monospace" font-size="9" text-anchor="middle">RESERVE</text>
  </g>

  <!-- Drive Lane / Access Corridor with directional security telemetry -->
  <path d="M50 270 H550" stroke="#00f5ff" stroke-width="2" stroke-dasharray="16 10"/>
  <text x="60" y="305" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="10">AUTH TOKEN: AES-256 HMAC VALIDATED</text>
  <text x="60" y="325" fill="#94a3b8" font-family="'Fira Code', monospace" font-size="9">AUDIT LOGGING: ENABLED // TAMPER-PROOF RECORDING</text>

  <!-- Security Shield Verification Badge -->
  <g transform="translate(460, 275)">
    <rect width="90" height="55" rx="6" fill="#0f172a" stroke="#00f5ff" stroke-width="1"/>
    <circle cx="480" cy="302" r="10" fill="#0284c7" fill-opacity="0.3" stroke="#00f5ff" stroke-width="1"/>
    <text x="505" y="297" fill="#00f5ff" font-family="'Fira Code', monospace" font-size="9" font-weight="bold">SECURE</text>
    <text x="505" y="312" fill="#10b981" font-family="'Fira Code', monospace" font-size="8">GATE PASS</text>
  </g>
</svg>
